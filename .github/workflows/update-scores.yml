name: Régler les scores

# Mode léger : déplace les matchs terminés vers l'historique à partir des
# pronostics déjà archivés + scores réels (endpoint "scores", peu coûteux).
# Ne recalcule AUCUNE cote/probabilité → le quota The Odds API est préservé.
# Le robot n'appelle l'API que si un match archivé devrait être terminé,
# donc la plupart des passages ne consomment rien. Toutes les heures :
# réduit le délai entre la fin d'un match et son passage dans l'historique.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  scores:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Régler les matchs terminés
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node robot/update.mjs --mode scores

      - name: Committer les résultats
        run: |
          git config user.name "predictions-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json data.js history.json history.js robot/state/pending.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(robot): règlement des scores"
            git push
          else
            echo "Aucun match à régler."
          fi
