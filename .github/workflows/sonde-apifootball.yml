name: Sonde API-Football (compo + notes)

# Lancement MANUEL. Vérifie que le plan API-Football renvoie les COMPOS et les
# NOTES JOUEURS (base du futur système de pronostic Loto Foot par composition).
# Consomme ~4-5 requêtes du quota.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sonde-apifootball
  cancel-in-progress: false

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sonder l'API
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: node robot/probe-lineup.mjs

      - name: Committer le rapport de sonde
        run: |
          git config user.name "predictions-bot"
          git config user.email "bot@users.noreply.github.com"
          git add analyse-ligue1/SONDE-APIFOOTBALL.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(sonde): capacités API-Football (compo + notes)"
            git push
          else
            echo "Aucun changement."
          fi
