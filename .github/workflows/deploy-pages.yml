name: Déployer sur GitHub Pages

# Publie le site statique sur GitHub Pages à chaque push des fichiers du site.
on:
  push:
    branches:
      - claude/world-cup-predictions-site-pjspe6
      - main
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "data.json"
      - "data.js"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Préparer l'artefact du site
        run: |
          mkdir -p _site
          cp index.html styles.css script.js data.json data.js _site/

      - name: Téléverser l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
