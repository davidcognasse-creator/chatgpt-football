name: Déployer sur GitHub Pages

# Publie le site statique sur GitHub Pages à chaque push des fichiers du site.
on:
  push:
    branches:
      - claude/world-cup-predictions-site-pjspe6
      - main
    paths:
      - "index.html"
      - "historique.html"
      - "simulateur.html"
      - "groupes.html"
      - "styles.css"
      - "script.js"
      - "historique.js"
      - "simulateur.js"
      - "groupes.js"
      - "firebase-config.js"
      - "flags.js"
      - "i18n.js"
      - "favicon.svg"
      - "og-image.png"
      - "robots.txt"
      - "sitemap.xml"
      - "data.json"
      - "data.js"
      - "history.json"
      - "history.js"
      - "winner.json"
      - "winner.js"
      - "CNAME"
      - ".github/workflows/deploy-pages.yml"
  # Redéploie après chaque run du robot (ses commits via GITHUB_TOKEN ne
  # déclenchent pas le trigger 'push', d'où ce workflow_run).
  workflow_run:
    workflows: ["Actualiser les pronostics"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build et deploy séparés : relancer le seul job "deploy" ne recrée pas un
  # second artefact (évite l'erreur "Multiple artifacts named github-pages").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Préparer l'artefact du site
        run: |
          mkdir -p _site
          cp index.html historique.html simulateur.html groupes.html _site/
          cp styles.css script.js historique.js simulateur.js groupes.js firebase-config.js flags.js i18n.js _site/
          cp data.json data.js history.json history.js winner.json winner.js _site/
          cp favicon.svg og-image.png robots.txt sitemap.xml _site/
          cp CNAME _site/   # déclare le domaine personnalisé à GitHub Pages

      - name: Téléverser l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
