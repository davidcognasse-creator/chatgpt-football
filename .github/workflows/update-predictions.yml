name: Actualiser les pronostics

# Le robot régénère data.json / data.js à partir des sources (paris, presse, X)
# puis committe les changements. Planifié 1×/jour à 07:00 UTC (économie du quota
# The Odds API avec les player props "buteurs") + déclenchement manuel.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode du robot (fixtures = démo, live = vraies API)"
        required: false
        default: "live"

permissions:
  contents: write

concurrency:
  group: update-predictions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lancer le robot
        env:
          # En mode live, renseignez ces secrets dans Settings → Secrets :
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}          # paris (requis)
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }} # forme + face-à-face
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}      # buzz X (sinon Wikipédia)
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}          # presse GNews (sinon GDELT)
        run: node robot/update.mjs --mode "${{ github.event.inputs.mode || 'live' }}"

      - name: Committer les données mises à jour
        run: |
          git config user.name "predictions-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json data.js history.json history.js robot/state/pending.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(robot): actualisation des pronostics"
            git push
          else
            echo "Aucun changement de pronostics."
          fi
